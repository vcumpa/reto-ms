server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El navegador habla con el mismo origen. Nginx usa el DNS interno de
    # Compose para alcanzar al Gateway, por lo que no se expone su hostname
    # ni se necesitan cabeceras CORS.
    location /api/ {
        proxy_pass http://apigateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router necesita devolver la SPA en rutas que no son archivos.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
