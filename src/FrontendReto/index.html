<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cliente web para el sistema de carga masiva de archivos Excel: autenticación, subida, historial y trazabilidad de procesamiento asíncrono."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Carga Masiva</title>
    <script>
      // Evita el "flash" del tema incorrecto antes de que React monte.
      // La clave debe coincidir con THEME_KEY en src/utils/themeStorage.ts.
      (function () {
        try {
          var stored = localStorage.getItem('carga_masiva_theme');
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* noop */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
